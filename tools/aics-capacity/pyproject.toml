[project]
name = "aics-capacity"
version = "0.1.0"
description = "Operator-run, bounded capacity measurement for AICS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aics-identity", "aics-tlog", "aics-conformance", "httpx>=0.28,<1"]

[project.scripts]
aics-capacity = "aics_capacity.cli:main"

[tool.uv.sources]
aics-identity = { path = "../../packages/aics-identity" }
aics-tlog = { path = "../../packages/aics-tlog" }
aics-conformance = { path = "../../packages/aics-conformance" }

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.0", "ruff>=0.14"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --basetemp=.test-tmp"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
