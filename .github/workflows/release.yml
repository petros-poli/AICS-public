name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      publish-pypi: ${{ steps.policy.outputs.enabled }}
      pypi-only-project: ${{ steps.policy.outputs.project }}
    steps:
      - name: Refuse to replace a published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.parse

          tag = urllib.parse.quote(os.environ["RELEASE_TAG"], safe="")
          result = subprocess.run([
              "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}"
          ], text=True, capture_output=True)
          if result.returncode:
              try:
                  status = str(json.loads(result.stdout).get("status"))
              except (ValueError, AttributeError):
                  status = "unknown"
              if status != "404":
                  raise SystemExit(result.stderr or "Could not check for an existing release")
          elif not json.loads(result.stdout)["draft"]:
              raise SystemExit("Release is already published; use a new tag, or rerun only the failed PyPI job")
          PY
      - name: Report the PyPI publishing policy
        id: policy
        env:
          PUBLISH_PYPI: ${{ vars.PUBLISH_PYPI }}
          PYPI_ONLY_PROJECT: ${{ vars.PYPI_ONLY_PROJECT }}
        run: |
          python3 - <<'PY'
          import os
          import re

          allowed = {"aics-identity", "aics-tlog", "aics-witness",
                     "aics-conformance", "aics-cli", "aics-mcp"}
          requested = os.environ.get("PYPI_ONLY_PROJECT", "")
          if requested and not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?", requested):
              raise SystemExit("PYPI_ONLY_PROJECT must be empty or a valid PyPI project name")
          project = re.sub(r"[-_.]+", "-", requested).lower()
          if project and project not in allowed:
              raise SystemExit("PYPI_ONLY_PROJECT is not one of the six release projects")
          # Freeze validated policy once; later steps never reread repository variables.
          # Python comparison is case sensitive; Actions expression equality is not.
          enabled = os.environ.get("PUBLISH_PYPI") == "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"enabled={str(enabled).lower()}", file=output)
              print(f"project={project}", file=output)
          if enabled:
              print(f"PyPI publishing enabled for {project or 'all six projects'} after release verification succeeds.")
          else:
              print('PyPI publishing skipped: PUBLISH_PYPI is not exactly "true" (unset defaults to skipped).')
          PY

  tests:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  # Builds every library twice and exports only byte-identical artifacts.
  # Local reusable workflows come from the same commit as this release workflow.
  build:
    needs: prepare
    uses: ./.github/workflows/reproducible.yml

  sign:
    needs: [tests, build]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-dist
          path: dist
      - name: Sign distributions and inventory using GitHub OIDC
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          release-signing-artifacts: false
          upload-signing-artifacts: false
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Export detached signatures and certificates from the signed bundles
        run: |
          python3 - <<'PY'
          import base64
          import json
          import textwrap
          from pathlib import Path

          for bundle in sorted(Path("dist").glob("*.sigstore.json")):
              data = json.loads(bundle.read_text())
              target = str(bundle).removesuffix(".sigstore.json")
              signature = data["messageSignature"]["signature"]
              base64.b64decode(signature, validate=True)
              Path(target + ".sig").write_text(signature + "\n")
              material = data["verificationMaterial"]
              certificate = material.get("certificate")
              if certificate is None:
                  certificate = material["x509CertificateChain"]["certificates"][0]
              der = base64.b64decode(certificate["rawBytes"], validate=True)
              pem = "\n".join(textwrap.wrap(base64.b64encode(der).decode(), 64))
              Path(target + ".crt").write_text(
                  f"-----BEGIN CERTIFICATE-----\n{pem}\n-----END CERTIFICATE-----\n"
              )
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  provenance:
    needs: [build, sign]
    permissions:
      actions: read
      id-token: write
      contents: write # The generator creates a draft release containing provenance.
    # Required exception to SHA pinning: the verifier requires a semantic version tag.
    # v2.1.0 resolves to f7dd8c54c2067bafc12ca7a55595d5ee9b75204a.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: aics.intoto.jsonl
      upload-assets: true
      draft-release: "true"
      # Keyless signing records repository/workflow metadata in public Rekor.
      private-repository: false

  github-release:
    needs: [sign, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-dist
          path: dist
      - name: Attach distributions, signatures, certificates and bundles; publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [[ "$draft" == true ]] || { echo "Refusing to replace a published release."; exit 1; }
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          # Markdown backticks must remain literal in the printf format string.
          # shellcheck disable=SC2016
          printf 'Source commit: `%s`\n\nBuilt twice on independent runners; wheel and sdist SHA-256 hashes matched.\n\nVerify with `bash scripts/verify-release.sh %s` from a trusted checkout. See docs/RELEASING.md.\n' \
            "$SOURCE_COMMIT" "$RELEASE_TAG" > release-notes.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" --notes-file release-notes.md --draft=false

  pypi:
    name: Publish ${{ matrix.project }} to PyPI
    if: ${{ needs.prepare.outputs.publish-pypi == 'true' }}
    needs: [prepare, github-release]
    runs-on: ubuntu-24.04
    strategy:
      # First publication may need two batches: PyPI permits only three pending
      # publishers per account. Rerun failed jobs without republishing successes.
      fail-fast: false
      matrix:
        include:
          - project: aics-identity
            environment: pypi
          - project: aics-tlog
            environment: pypi-aics-tlog
          - project: aics-witness
            environment: pypi-aics-witness
          - project: aics-conformance
            environment: pypi-aics-conformance
          - project: aics-cli
            environment: pypi-aics
          - project: aics-mcp
            environment: pypi-aics-mcp
    environment:
      name: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.prepare.outputs.pypi-only-project == '' || needs.prepare.outputs.pypi-only-project == matrix.project }}
        with:
          name: verified-dist
          path: verified
      - name: Select this project's verified wheel and sdist
        if: ${{ needs.prepare.outputs.pypi-only-project == '' || needs.prepare.outputs.pypi-only-project == matrix.project }}
        env:
          PYPI_PROJECT: ${{ matrix.project }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import shutil
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          project = os.environ["PYPI_PROJECT"]
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", project):
              raise SystemExit("Invalid PyPI project name")
          # Distribution filenames normalize hyphens to underscores.
          # The final dash keeps similarly prefixed project names separate.
          prefix = project.replace("-", "_") + "-"
          verified = Path("verified")
          selected = []
          versions = set()
          for suffix in (".whl", ".tar.gz"):
              candidates = sorted(p for p in verified.iterdir()
                                  if p.name.startswith(prefix) and p.name.endswith(suffix))
              if len(candidates) != 1:
                  raise SystemExit(f"Expected exactly one {project} {suffix}; found {len(candidates)}")
              path = candidates[0]
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"Not a regular distribution: {path.name}")
              if suffix == ".whl":
                  fields = path.name[:-4].split("-")
                  if len(fields) not in (5, 6):
                      raise SystemExit(f"Invalid wheel filename: {path.name}")
                  version = fields[1]
                  metadata_path = f"{fields[0]}-{version}.dist-info/METADATA"
                  with zipfile.ZipFile(path) as archive:
                      metadata_files = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
                      if metadata_files != [metadata_path]:
                          raise SystemExit(f"Unexpected wheel metadata: {path.name}")
                      metadata = archive.read(metadata_path)
              else:
                  stem = path.name[:-7]
                  version = stem[len(prefix):]
                  with tarfile.open(path, "r:gz") as archive:
                      entries = [m for m in archive.getmembers() if m.name == f"{stem}/PKG-INFO"]
                      if len(entries) != 1 or not entries[0].isfile():
                          raise SystemExit(f"Missing or ambiguous sdist metadata: {path.name}")
                      metadata = archive.extractfile(entries[0]).read()
              info = BytesParser().parsebytes(metadata)
              names, metadata_versions = info.get_all("Name", []), info.get_all("Version", [])
              if (len(names) != 1 or re.sub(r"[-_.]+", "-", names[0]).lower() != project
                      or metadata_versions != [version]):
                  raise SystemExit(f"Distribution metadata does not match filename/project: {path.name}")
              versions.add(version)
              selected.append(path)
          if len(versions) != 1:
              raise SystemExit("Wheel and sdist versions differ")
          hashes = {}
          for line in (verified / "SHA256SUMS").read_text().splitlines():
              digest, name = line.split("  ", 1)
              if name in hashes or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit("Invalid distribution inventory")
              hashes[name] = digest
          for path in selected:
              if hashes.get(path.name) != hashlib.sha256(path.read_bytes()).hexdigest():
                  raise SystemExit(f"Verified inventory mismatch: {path.name}")
          # Copy only after every check passes; never include other projects or
          # signing sidecars in a publisher's upload directory.
          Path("dist").mkdir()
          for path in selected:
              shutil.copyfile(path, Path("dist") / path.name)
              print(f"Selected {project}: {path.name}")
          PY
      - name: Publish with PyPI trusted publishing
        if: ${{ needs.prepare.outputs.pypi-only-project == '' || needs.prepare.outputs.pypi-only-project == matrix.project }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
