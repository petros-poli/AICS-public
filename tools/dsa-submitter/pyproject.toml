[project]
name = "dsa-submitter"
version = "0.1.0"
description = "DSA Article 24(5) submitter for wesupport-ai.com: sends each restriction leaf's statement of reasons to the European Commission's Transparency Database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dsa-submitter = "dsa_submitter.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
